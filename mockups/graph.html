<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusGraph — Graph</title>
  <link rel="stylesheet" href="css/nexus.css">
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
</head>
<body>
<div class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">N</div>
      <div class="sidebar-title">NexusGraph</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="editor.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Éditeur
      </a>
      <div class="nav-section-label">Exploration</div>
      <a href="graph.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="8.5" y1="7.5" x2="15.5" y2="16.5"/><line x1="15.5" y1="7.5" x2="8.5" y2="16.5"/></svg>
        Graph
      </a>
      <a href="entity.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Entités
      </a>
      <div class="nav-section-label">Système</div>
      <a class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Paramètres
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" onclick="toggleTheme()" title="Changer de thème">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.5" y1="7.5" x2="15.5" y2="16.5"/></svg>
          <span>Map Relationnelle</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Rechercher dans le graphe...">
        </div>
        <button class="btn btn-secondary btn-sm" onclick="resetLayout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Réorganiser
        </button>
      </div>
    </header>

    <div class="graph-map-layout">
      <!-- Filters Panel -->
      <div class="graph-filters">
        <div>
          <div class="filter-group-title">Types d'entités</div>
          <div class="filter-item checked" data-type="Personne" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:#8b5cf6"></span>
            Personnes <span class="text-tertiary text-sm">(8)</span>
          </div>
          <div class="filter-item checked" data-type="Projet" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:#10b981"></span>
            Projets <span class="text-tertiary text-sm">(4)</span>
          </div>
          <div class="filter-item checked" data-type="Organisation" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:#f59e0b"></span>
            Organisations <span class="text-tertiary text-sm">(6)</span>
          </div>
          <div class="filter-item checked" data-type="Savoir" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:#ec4899"></span>
            Savoirs <span class="text-tertiary text-sm">(5)</span>
          </div>
        </div>

        <div>
          <div class="filter-group-title">Tags</div>
          <div class="filter-item checked" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:var(--danger)"></span>
            Urgent
          </div>
          <div class="filter-item checked" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:var(--info)"></span>
            DSI
          </div>
          <div class="filter-item checked" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="tag-dot" style="background:var(--warning)"></span>
            Budget
          </div>
        </div>

        <div>
          <div class="filter-group-title">Relations</div>
          <div class="filter-item checked" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            appartient à
          </div>
          <div class="filter-item checked" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            travaille sur
          </div>
          <div class="filter-item checked" onclick="this.classList.toggle('checked')">
            <div class="filter-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
            mentionne
          </div>
        </div>
      </div>

      <!-- Full Graph Canvas -->
      <div class="graph-full-canvas" id="cy">
        <!-- Legend -->
        <div class="graph-legend">
          <div style="font-weight:600;font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Légende</div>
          <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Personne</div>
          <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>Projet</div>
          <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Organisation</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ec4899"></div>Savoir</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// Theme
function toggleTheme(){const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.querySelector('.icon-sun').style.display=d?'block':'none';document.querySelector('.icon-moon').style.display=d?'none':'block';localStorage.setItem('theme',d?'light':'dark');initGraph()}
if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');document.addEventListener('DOMContentLoaded',()=>{document.querySelector('.icon-sun').style.display='none';document.querySelector('.icon-moon').style.display='block'})}

let graphInstance;
function resetLayout(){if(graphInstance)graphInstance.layout({name:'cose',padding:40,nodeRepulsion:6000,idealEdgeLength:100,animate:true,animationDuration:800}).run()}

function initGraph(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  graphInstance=cytoscape({
    container:document.getElementById('cy'),
    elements:[
      // Personnes
      {data:{id:'adil',label:'Adil Bensaid',type:'Personne'}},
      {data:{id:'marie',label:'Marie Lefèvre',type:'Personne'}},
      {data:{id:'lucas',label:'Lucas Martin',type:'Personne'}},
      {data:{id:'sophie',label:'Sophie Chen',type:'Personne'}},
      {data:{id:'thomas',label:'Thomas Durand',type:'Personne'}},
      {data:{id:'nadia',label:'Nadia Amari',type:'Personne'}},
      {data:{id:'pierre',label:'Pierre Morel',type:'Personne'}},
      {data:{id:'julie',label:'Julie Bertrand',type:'Personne'}},
      // Projets
      {data:{id:'mig',label:'Migration SI v2.0',type:'Projet'}},
      {data:{id:'intra',label:'Refonte Intranet',type:'Projet'}},
      {data:{id:'rgpd',label:'Audit RGPD',type:'Projet'}},
      {data:{id:'poste',label:'Déploiement Poste',type:'Projet'}},
      // Organisations
      {data:{id:'brh',label:'Bureau RH',type:'Organisation'}},
      {data:{id:'si',label:'Service Info',type:'Organisation'}},
      {data:{id:'dfi',label:'Dir. Finances',type:'Organisation'}},
      {data:{id:'dg',label:'Dir. Générale',type:'Organisation'}},
      {data:{id:'bform',label:'Bureau Formation',type:'Organisation'}},
      {data:{id:'bjur',label:'Bureau Juridique',type:'Organisation'}},
      // Savoirs
      {data:{id:'proto',label:'Protocole achat',type:'Savoir'}},
      {data:{id:'archi',label:'Archi. Java Legacy',type:'Savoir'}},
      {data:{id:'budget',label:'Procédure budget',type:'Savoir'}},
      {data:{id:'sso',label:'Doc SSO/LDAP',type:'Savoir'}},
      {data:{id:'rgpdoc',label:'Guide RGPD',type:'Savoir'}},
      // Relations
      {data:{source:'adil',target:'si',label:'appartient à'}},
      {data:{source:'marie',target:'si',label:'appartient à'}},
      {data:{source:'lucas',target:'brh',label:'appartient à'}},
      {data:{source:'sophie',target:'dfi',label:'appartient à'}},
      {data:{source:'thomas',target:'brh',label:'appartient à'}},
      {data:{source:'nadia',target:'dg',label:'appartient à'}},
      {data:{source:'pierre',target:'bform',label:'appartient à'}},
      {data:{source:'julie',target:'bjur',label:'appartient à'}},
      {data:{source:'adil',target:'mig',label:'travaille sur'}},
      {data:{source:'marie',target:'intra',label:'travaille sur'}},
      {data:{source:'lucas',target:'rgpd',label:'travaille sur'}},
      {data:{source:'sophie',target:'mig',label:'travaille sur'}},
      {data:{source:'thomas',target:'poste',label:'travaille sur'}},
      {data:{source:'nadia',target:'mig',label:'supervise'}},
      {data:{source:'pierre',target:'poste',label:'travaille sur'}},
      {data:{source:'julie',target:'rgpd',label:'travaille sur'}},
      {data:{source:'mig',target:'archi',label:'utilise'}},
      {data:{source:'mig',target:'sso',label:'utilise'}},
      {data:{source:'mig',target:'proto',label:'réf.'}},
      {data:{source:'rgpd',target:'rgpdoc',label:'utilise'}},
      {data:{source:'intra',target:'sso',label:'utilise'}},
      {data:{source:'dfi',target:'budget',label:'gère'}},
      {data:{source:'brh',target:'bform',label:'supervise'}},
      {data:{source:'si',target:'dg',label:'rattaché à'}},
      {data:{source:'dfi',target:'dg',label:'rattaché à'}},
    ],
    style:[
      {selector:'node',style:{'label':'data(label)','text-valign':'bottom','text-margin-y':10,'font-size':11,'font-family':'Inter,sans-serif','color':isDark?'#8b92a8':'#6b7280','text-max-width':100,'text-wrap':'wrap','text-halign':'center','width':40,'height':40,'border-width':2.5,'transition-property':'border-width, width, height','transition-duration':'0.2s'}},
      {selector:'node:active',style:{'overlay-opacity':0}},
      {selector:'node[type="Personne"]',style:{'background-color':'#8b5cf6','border-color':'#a78bfa'}},
      {selector:'node[type="Projet"]',style:{'background-color':'#10b981','border-color':'#34d399','width':50,'height':50,'font-size':12,'font-weight':600}},
      {selector:'node[type="Organisation"]',style:{'background-color':'#f59e0b','border-color':'#fbbf24','shape':'round-rectangle','width':48,'height':36}},
      {selector:'node[type="Savoir"]',style:{'background-color':'#ec4899','border-color':'#f472b6','shape':'diamond','width':36,'height':36}},
      {selector:'edge',style:{'width':1.5,'line-color':isDark?'#2a2a3c':'#ddd','curve-style':'bezier','opacity':.5,'target-arrow-shape':'triangle','target-arrow-color':isDark?'#2a2a3c':'#ddd','arrow-scale':.7}},
      {selector:'node:selected',style:{'border-width':4,'border-color':isDark?'#818cf8':'#6366f1','width':52,'height':52}},
    ],
    layout:{name:'cose',padding:40,nodeRepulsion:6000,idealEdgeLength:100,animate:true,animationDuration:800,randomize:false},
    userZoomingEnabled:true,userPanningEnabled:true,boxSelectionEnabled:false,
  });

  // Hover highlight
  cy=graphInstance;
  cy.on('mouseover','node',function(e){
    const n=e.target;
    const hood=n.closedNeighborhood();
    cy.elements().not(hood).style({opacity:.15});
    hood.style({opacity:1});
    n.style({'border-width':4});
  });
  cy.on('mouseout','node',function(){
    cy.elements().style({opacity:1});
    cy.nodes().style({'border-width':2.5});
  });
}
document.addEventListener('DOMContentLoaded',initGraph);
</script>
</body>
</html>
